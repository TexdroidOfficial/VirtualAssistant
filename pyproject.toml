[project]
name = "virtualassistantrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Texdroid", email = "texdroidofficial@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.6",
    "langchain-chroma",
    "langchain-community>=0.4.2",
    "langchain-ollama",
    "langchain-text-splitters",
    "pypdf>=6.21.2",
    "streamlit>=1.66.1",
]

[project.scripts]
virtualassistantrag = "virtualassistantrag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
